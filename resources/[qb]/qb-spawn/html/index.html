<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>QBCore - Spawnlocation</title>
        <link rel="stylesheet" type="text/css" href="reset.css" />
        <link rel="stylesheet" type="text/css" href="style.css" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.1.3/axios.min.js"></script>
        <script src="vue.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.min.css" rel="stylesheet" />
    </head>
    <body>
        <v-app data-app>
            <div id="app">
                <div class="container">
                    <div class="noselect">
                        <div class="spawn-locations" :class="{'slide-top-fade-leave-active': show == false, 'slide-top-fade-leave-to': show == false}">
                            <div class="spawn_locations-header">
                                <p>
                                    <span id="null">{{translate('where_would_you_like_to_start')}}</span>
                                </p>
                            </div>

                            <v-btn v-for="(location, locationKey) in positions.normal" :key="locationKey" elevation="0" color="#00000000" :class="{'selected': selectedValue.type === 'normal' && selectedValue.name === locationKey}" class="location" x-large v-ripple @click="click_location('normal', locationKey)">{{ location.label }}</v-btn>

                            <v-btn @click="submit_spawn" v-ripple x-large class="submit-spawn" v-if="selectedValue.type !== '' && selectedValue.name !== ''"> {{translate('confirm')}} </v-btn>
                        </div>
                    </div>
                </div>
            </div>
        </v-app>

        <script>
            const viewmodel = new Vue({
                el: "#app",
                vuetify: new Vuetify(),
                data: {
                    positions: {
                        normal: {},
                    },

                    selectedValue: {
                        type: "",
                        name: "",
                    },

                    newChar: false,
                    show: false,
                    translations: {},
                },

                methods: {
                    click_location: function (type, name) {
                        if (type !== 'normal' || !this.positions.normal[name]) return;
                        axios.post('https://qb-spawn/setCam', { posname: name, type: 'normal' });
                        this.selectedValue = { type: 'normal', name: name };
                    },

                    submit_spawn: function () {
                        const data = this.selectedValue;
                        if (data.type !== 'normal' || !this.positions.normal[data.name]) return;
                        this.show = false;
                        axios.post('https://qb-spawn/spawnplayer', {
                            spawnloc: data.name,
                            typeLoc: 'normal',
                        });
                    },

                    translate(phrase) {
                        return this.translations[phrase] || `Could not find phrase: ${phrase}`;
                    },
                },

                mounted() {
                    window.addEventListener("message", function (event) {
                        let data = event.data;
                        switch (data.action) {
                            case "showUi":
                                viewmodel.show = data.status;
                                viewmodel.translations = event.data.translations;
                                break;

                            case "setupLocations":
                            case "setupAppartements":
                                viewmodel.positions = { normal: data.locations && data.action === 'setupLocations' ? data.locations : {} };
                                viewmodel.selectedValue = { type: '', name: '' };
                                viewmodel.newChar = data.isNew;
                                break;
                        }
                    });
                },
            });
        </script>
    </body>
</html>

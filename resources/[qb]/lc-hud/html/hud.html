<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Country Roleplay HUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="hud" class="hud hidden">

    <!-- IME-style clean information: text only, no square/card boxes. -->
    <aside id="imeInfo" class="ime-info" aria-label="Player information">
        <div class="ime-brand-row">
            <div class="ime-brand-text">
                <strong>GRAND COUNTRY</strong>
                <span>ROLEPLAY</span>
            </div>

            <div id="logoBox" class="logo-box">
                <video class="server-logo" autoplay loop muted playsinline poster="../images/logo.png" aria-label="Grand Country Roleplay logo">
                    <source src="../images/logo.webm" type="video/webm">
                </video>
            </div>
        </div>

        <div class="ime-meta">
            <span id="serverId">#0</span>
            <span class="ime-dot">•</span>
            <span id="dateText">--/--/----</span>
            <span class="ime-dot">•</span>
            <span id="timeText">--:--</span>
        </div>

        <!-- IME-style icon rows. Icons are inline SVG, not emoji, so they render consistently in FiveM NUI. -->
        <div class="ime-line">
            <div class="ime-label">
                <span class="ime-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3Zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3Zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13Zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5Z"/></svg>
                </span>
                <span>ONLINE</span>
            </div>
            <strong id="playerCount">0</strong>
        </div>

        <div class="ime-line">
            <div class="ime-label">
                <span class="ime-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M20 7H5.5A1.5 1.5 0 0 1 4 5.5 1.5 1.5 0 0 1 5.5 4H18V2H5.5A3.5 3.5 0 0 0 2 5.5V18a4 4 0 0 0 4 4h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Zm0 8h-4a2 2 0 1 1 0-4h4v4Z"/></svg>
                </span>
                <span>CASH</span>
            </div>
            <strong id="cash">$0</strong>
        </div>

        <div class="ime-line">
            <div class="ime-label">
                <span class="ime-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M12 2 2 7v2h20V7L12 2ZM4 11v7H2v2h20v-2h-2v-7h-2v7h-3v-7h-2v7h-2v-7H9v7H6v-7H4Z"/></svg>
                </span>
                <span>BANK</span>
            </div>
            <strong id="bank">$0</strong>
        </div>

        <div class="ime-line">
            <div class="ime-label">
                <span class="ime-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M9 4V2h6v2h4a3 3 0 0 1 3 3v3.2c-2.9 1.24-6.27 1.8-10 1.8s-7.1-.56-10-1.8V7a3 3 0 0 1 3-3h4Zm2 0h2V4h-2ZM2 12.35V19a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3v-6.65c-2.94 1.08-6.29 1.65-10 1.65s-7.06-.57-10-1.65Z"/></svg>
                </span>
                <span>JOB</span>
            </div>
            <strong id="job">Civilian - Freelancer</strong>
        </div>

        <div class="ime-line">
            <div class="ime-label">
                <span class="ime-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-6.5-.5A3.5 3.5 0 1 0 5.5 4a3.5 3.5 0 0 0 0 7.5Zm13 0A3.5 3.5 0 1 0 18.5 4a3.5 3.5 0 0 0 0 7.5ZM12 14c-3.31 0-6 1.79-6 4v2h12v-2c0-2.21-2.69-4-6-4ZM5.5 13C2.46 13 0 14.57 0 16.5V19h4v-1c0-1.47.72-2.76 1.94-3.75A8.3 8.3 0 0 0 5.5 13Zm13 0c-.15 0-.3 0-.44.02A5.08 5.08 0 0 1 20 18v1h4v-2.5c0-1.93-2.46-3.5-5.5-3.5Z"/></svg>
                </span>
                <span>GANG</span>
            </div>
            <strong id="gang">No Gang - Unaffiliated</strong>
        </div>

        <!-- Ammo sits directly under the right-side text and only appears with a firearm. -->
        <div id="ammoHud" class="ammo-hud hidden-card">
            <span class="ammo-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M3 8h12.2l2.15 2.15h3.15a1.5 1.5 0 0 1 0 3h-4.3l-1.2-1.2-1.85 1.85V16h-3v-1.65H8.4L7.1 19H4l1.55-5.43L3 12V8Zm3 2v1h7.3l1-1H6Z"/></svg>
            </span>
            <span class="ammo-label">AMMO</span>
            <strong id="ammoClip">0</strong>
            <span class="ammo-divider">/</span>
            <span id="ammoReserve">0</span>
        </div>
    </aside>

    <!-- Left-bottom HUD stays close to the GTA minimap. -->
    <section class="status-stack" aria-label="Player status">
        <div class="status-row health-row">
            <div class="status-badge">❤</div>
            <div class="status-content">
                <div class="status-caption"><span>HEALTH</span><b id="healthText">100%</b></div>
                <div class="bar-shell"><div id="healthBar" class="bar-fill health-fill"></div></div>
            </div>
        </div>

        <div class="status-row armor-row">
            <div class="status-badge">◆</div>
            <div class="status-content">
                <div class="status-caption"><span>ARMOR</span><b id="armorText">0%</b></div>
                <div class="bar-shell"><div id="armorBar" class="bar-fill armor-fill"></div></div>
            </div>
        </div>

        <div class="circle-status-wrap">
            <div id="voiceCircle" class="circle-status">
                <div class="circle-core">
                    <span class="mic-vector" aria-hidden="true">
                        <svg class="mic-svg" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21H8v2h8v-2h-3v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
                    </span>
                </div>
                <span id="voiceText" class="circle-value">OFF</span>
                <small class="circle-label">MIC</small>
            </div>

            <div id="hungerCircle" class="circle-status">
                <div class="circle-core"><span>🍔</span></div>
                <span id="hungerValue" class="circle-value">100%</span>
                <small class="circle-label">MAKAN</small>
            </div>

            <div id="thirstCircle" class="circle-status">
                <div class="circle-core"><span>🥤</span></div>
                <span id="thirstValue" class="circle-value">100%</span>
                <small class="circle-label">MINUM</small>
            </div>

            <div id="stressCircle" class="circle-status">
                <div class="circle-core"><span>🧠</span></div>
                <span id="stressValue" class="circle-value">0%</span>
                <small class="circle-label">STRESS</small>
            </div>

            <div id="staminaCircle" class="circle-status">
                <div class="circle-core"><span>🏃</span></div>
                <span id="staminaValue" class="circle-value">100%</span>
                <small class="circle-label">LARI</small>
            </div>
        </div>
    </section>

    <!-- Existing integrated vehicle HUD remains available. -->
    <section id="vehicleHud" class="vehicle-hud hidden-card" aria-hidden="true">
        <div class="vehicle-speedo">
            <svg class="vehicle-dial" viewBox="0 0 230 150" aria-hidden="true">
                <path class="dial-track" d="M 27 125 A 88 88 0 0 1 203 125" pathLength="100"></path>
                <path id="vehicleRpmArc" class="dial-rpm" d="M 27 125 A 88 88 0 0 1 203 125" pathLength="100"></path>

                <g class="dial-ticks">
                    <line x1="35"  y1="112" x2="26"  y2="109"></line>
                    <line x1="43"  y1="87"  x2="34"  y2="82"></line>
                    <line x1="59"  y1="64"  x2="52"  y2="57"></line>
                    <line x1="82"  y1="47"  x2="78"  y2="37"></line>
                    <line x1="115" y1="40"  x2="115" y2="29"></line>
                    <line x1="148" y1="47"  x2="152" y2="37"></line>
                    <line x1="171" y1="64"  x2="178" y2="57"></line>
                    <line x1="187" y1="87"  x2="196" y2="82"></line>
                    <line x1="195" y1="112" x2="204" y2="109"></line>
                </g>

                <g class="dial-numbers">
                    <text x="76" y="43">1</text>
                    <text x="96" y="32">2</text>
                    <text x="115" y="29">3</text>
                    <text x="135" y="32">4</text>
                    <text x="155" y="43">5</text>
                </g>
            </svg>

            <div class="vehicle-speed-center">
                <div id="vehicleSpeed" class="vehicle-speed-value">0</div>
                <div id="vehicleUnit" class="vehicle-speed-unit">KM/H</div>
            </div>

            <div class="vehicle-bottom-row">
                <div id="fuelStatus" class="vehicle-photo-status">
                    <span>FUEL</span>
                    <div class="vehicle-status-track"><i id="vehicleFuelBar"></i></div>
                    <b id="vehicleFuel">100%</b>
                </div>

                <div id="engineStatus" class="vehicle-photo-status">
                    <span>ENG</span>
                    <div class="vehicle-status-track"><i id="vehicleEngineBar"></i></div>
                    <b id="vehicleEngine">100%</b>
                </div>

                <div id="beltStatus" class="vehicle-photo-status belt">
                    <span>BELT</span>
                    <div class="vehicle-status-track"><i id="vehicleBeltBar"></i></div>
                    <b id="vehicleBelt">OFF</b>
                </div>
            </div>
        </div>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>

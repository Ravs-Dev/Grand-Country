<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GCR Vehicle HUD Preview</title>
<link rel="stylesheet" href="vehicle_hud.css">
<style>
html,body{margin:0;width:100%;height:100%;background:#323232;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(135deg,#666,#222);opacity:.55}
</style>
</head>
<body>
<!-- Replace the old vehicleHud section with this block -->
<section id="vehicleHud" class="gcr-speedometer" aria-hidden="true">
    <div class="speedo-shell">
        <svg class="speedo-dial" viewBox="0 0 240 158" aria-hidden="true">
            <path class="speedo-arc-bg" d="M 28 128 A 92 92 0 0 1 212 128" pathLength="100"/>
            <path id="vehicleRpmArc" class="speedo-arc-live" d="M 28 128 A 92 92 0 0 1 212 128" pathLength="100"/>
            <g class="speedo-ticks">
                <line x1="40" y1="111" x2="31" y2="107"/>
                <line x1="48" y1="87" x2="39" y2="81"/>
                <line x1="65" y1="65" x2="58" y2="57"/>
                <line x1="87" y1="49" x2="83" y2="39"/>
                <line x1="120" y1="43" x2="120" y2="31"/>
                <line x1="153" y1="49" x2="157" y2="39"/>
                <line x1="175" y1="65" x2="182" y2="57"/>
                <line x1="192" y1="87" x2="201" y2="81"/>
                <line x1="200" y1="111" x2="209" y2="107"/>
            </g>
            <g class="speedo-numbers">
                <text x="73" y="51">1</text>
                <text x="96" y="38">2</text>
                <text x="120" y="34">3</text>
                <text x="145" y="38">4</text>
                <text x="168" y="51">5</text>
            </g>
        </svg>

        <div class="speedo-center">
            <div id="vehicleGear" class="speedo-gear">N</div>
            <div id="vehicleSpeed" class="speedo-speed">0</div>
            <div id="vehicleUnit" class="speedo-unit">KM/H</div>
        </div>

        <div class="speedo-status-row">
            <div id="fuelStatus" class="vehicle-status">
                <span class="vehicle-status-label">FUEL</span>
                <div class="vehicle-mini-bar"><i id="vehicleFuelBar"></i></div>
                <b id="vehicleFuel">100%</b>
            </div>

            <div id="engineStatus" class="vehicle-status">
                <span class="vehicle-status-label">ENG</span>
                <div class="vehicle-mini-bar"><i id="vehicleEngineBar"></i></div>
                <b id="vehicleEngine">100%</b>
            </div>

            <div id="beltStatus" class="vehicle-status belt-status">
                <span class="vehicle-status-label">BELT</span>
                <div class="vehicle-mini-bar"><i id="vehicleBeltBar"></i></div>
                <b id="vehicleBelt">OFF</b>
            </div>
        </div>
    </div>
</section>

<script src="vehicle_hud.js"></script>
<script>
setInterval(() => {
  const t = Date.now()/1000;
  window.postMessage({
    action:'vehicle', visible:true,
    speed:Math.round(70 + Math.sin(t)*45),
    fuel:64, engine:88, gear:3,
    rpm:55 + Math.sin(t*2)*30,
    belt:true, unit:'KM/H'
  }, '*');
}, 100);
</script>
</body>
</html>

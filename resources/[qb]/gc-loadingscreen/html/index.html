<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grand Country Roleplay</title>
    <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
    <div class="background-fallback" aria-hidden="true"></div>
    <video class="background-video" id="background-video" autoplay muted loop playsinline preload="auto">
        <source src="./assets/background.webm" type="video/webm" />
    </video>

    <main class="loadscreen">
        <nav class="top-nav" aria-label="Server panels">
            <button class="nav-pill" type="button" data-menu="rules" aria-expanded="false">
                <img class="nav-icon" src="./assets/icons/nav-rules.svg" alt="" aria-hidden="true" />
                <span>Rules</span>
            </button>
            <button class="nav-pill" type="button" data-menu="keybinds" aria-expanded="false">
                <img class="nav-icon" src="./assets/icons/nav-keybinds.svg" alt="" aria-hidden="true" />
                <span>Keybinds</span>
            </button>
            <button class="nav-pill" type="button" data-menu="staff" aria-expanded="false">
                <img class="nav-icon" src="./assets/icons/nav-staff.svg" alt="" aria-hidden="true" />
                <span>Staff</span>
            </button>
        </nav>

        <section class="info-menu" id="info-menu" aria-live="polite" hidden>
            <button class="menu-close" id="menu-close" type="button" aria-label="Close menu">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 6 6 18"></path>
                    <path d="m6 6 12 12"></path>
                </svg>
            </button>
        </section>

        <section class="brand" aria-label="Grand Country Roleplay brand">
            <img class="logo-image" src="./assets/logo.png" alt="Grand Country Roleplay" onerror="this.hidden = true" />
        </section>

        <section class="loading-panel" aria-label="Loading progress">
            <p class="loading-label">Loading</p>
            <p class="loading-percent"><span id="loading-percent">0</span>%</p>
            <p class="loading-status" id="loading-status">Connecting to Grand Country...</p>
            <div class="progress-track" aria-hidden="true">
                <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
            </div>
        </section>

        <section class="music-card" aria-label="Music player">
            <div class="music-art">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                </svg>
            </div>
            <div class="track-meta">
                <p class="track-title">Grand Country Radio</p>
                <p class="track-artist"><span>GCRP</span></p>
                <div class="waveform" aria-hidden="true">
                    <span></span><span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>
            <div class="player-controls">
                <button id="previous-track" type="button" aria-label="Previous track">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m19 20-9-8 9-8v16Z"></path>
                        <path d="M5 19V5"></path>
                    </svg>
                </button>
                <button class="play-toggle" id="play-toggle" type="button" aria-label="Pause music">
                    <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M9 5v14M15 5v14"></path>
                    </svg>
                    <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m8 5 11 7-11 7V5Z"></path>
                    </svg>
                </button>
                <button id="next-track" type="button" aria-label="Next track">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m5 4 9 8-9 8V4Z"></path>
                        <path d="M19 5v14"></path>
                    </svg>
                </button>
                <div class="volume-control" id="volume-control">
                    <button id="mute-toggle" type="button" aria-label="Change music volume" aria-expanded="false">
                        <svg class="volume-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M11 5 6 9H2v6h4l5 4V5Z"></path>
                            <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
                            <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
                        </svg>
                        <svg class="muted-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M11 5 6 9H2v6h4l5 4V5Z"></path>
                            <path d="m22 9-6 6M16 9l6 6"></path>
                        </svg>
                    </button>
                    <div class="volume-popover" id="volume-popover" hidden>
                        <input id="volume-slider" type="range" min="0" max="100" value="35" aria-label="Music volume" />
                    </div>
                </div>
            </div>
            <audio id="music" preload="auto" autoplay loop playsinline>
                <source src="./assets/music/music-gcrp.mp3" type="audio/mpeg" />
            </audio>
        </section>

        <section class="socials" aria-label="Social links">
            <p>Connect With Us</p>
            <div class="social-row">
                <a href="#" aria-label="Discord">
                    <img class="social-icon" src="./assets/icons/discord.svg" alt="" aria-hidden="true" />
                </a>
                <a href="#" aria-label="Instagram">
                    <img class="social-icon" src="./assets/icons/instagram.svg" alt="" aria-hidden="true" />
                </a>
                <a href="#" aria-label="YouTube">
                    <img class="social-icon" src="./assets/icons/youtube.svg" alt="" aria-hidden="true" />
                </a>
                <a href="#" aria-label="Website">
                    <img class="social-icon" src="./assets/icons/globe.svg" alt="" aria-hidden="true" />
                </a>
            </div>
        </section>

    </main>

    <script src="./config.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>

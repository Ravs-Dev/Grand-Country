<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Country Roleplay HUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="hud">
        <!-- BODY SILHOUETTE -->
        <section id="body-panel">
            <img src="images/body.svg" alt="" id="body-image">
        </section>

        <!-- RIGHT SERVER INFO -->
        <section id="server-panel">
            <img src="images/logo.png" id="server-logo" alt="Grand Country Roleplay">

            <div class="info-line">
                <span class="info-text" id="player-id">#0</span>
                <span class="info-icon">🕹️</span>
            </div>

            <div class="info-line">
                <span class="info-text" id="datetime">--/--/----  --:--</span>
                <span class="info-icon">⏲️</span>
            </div>

            <div class="info-line">
                <span class="info-text" id="online">0 Players</span>
                <span class="info-icon">👤</span>
            </div>

            <div class="info-line">
                <span class="info-text" id="bank">$0</span>
                <span class="info-icon">💰</span>
            </div>

            <div class="info-line">
                <span class="info-text" id="cash">$0</span>
                <span class="info-icon">💵</span>
            </div>

            <div class="info-line">
                <span class="info-text" id="job">Civilian</span>
                <span class="info-icon">👥</span>
            </div>

            <div class="info-line">
                <span class="info-text" id="gang">No Gang</span>
                <span class="info-icon">🥷</span>
            </div>
        </section>

        <!-- LOWER LEFT STATUS -->
        <section id="status-panel">
            <div class="status-bar-row">
                <span class="left-icon health-icon">❤️</span>
                <div class="bar-track">
                    <div id="health-bar" class="bar-fill health-fill"></div>
                </div>
                <span class="bar-value" id="health-value">100</span>
            </div>

            <div class="status-bar-row">
                <span class="left-icon armor-icon">🪖</span>
                <div class="bar-track">
                    <div id="armor-bar" class="bar-fill armor-fill"></div>
                </div>
                <span class="bar-value" id="armor-value">0</span>
            </div>

            <div id="circle-row">
                <div class="status-circle voice-ring" id="voice-ring">
                    <div class="circle-inner">
                        <span class="circle-icon">🎙️</span>
                        <small id="voice-text">N</small>
                    </div>
                </div>

                <div class="status-circle hunger-ring" id="hunger-ring">
                    <div class="circle-inner">
                        <span class="circle-icon">🍕</span>
                        <small id="hunger-value">100</small>
                    </div>
                </div>

                <div class="status-circle thirst-ring" id="thirst-ring">
                    <div class="circle-inner">
                        <span class="circle-icon">🥤</span>
                        <small id="thirst-value">100</small>
                    </div>
                </div>

                <div class="status-circle stamina-ring" id="stamina-ring">
                    <div class="circle-inner">
                        <span class="circle-icon">👟</span>
                        <small id="stamina-value">100</small>
                    </div>
                </div>

                <div class="status-circle stress-ring" id="stress-ring">
                    <div class="circle-inner">
                        <span class="circle-icon">🧠</span>
                        <small id="stress-value">0</small>
                    </div>
                </div>
            </div>
        </section>

        <!-- VEHICLE HUD -->
        <section id="vehicle-panel" class="hidden">
            <div id="speed-number">000</div>
            <div id="speed-unit">KM/H</div>

            <div class="vehicle-mini-row">
                <span>GEAR</span>
                <b id="gear-value">0</b>
            </div>

            <div class="vehicle-mini-row">
                <span>FUEL</span>
                <b id="fuel-value">100%</b>
            </div>

            <div class="vehicle-bar">
                <div id="fuel-bar"></div>
            </div>
        </section>

        <!-- RADIO / RANGE -->
        <section id="radio-panel">
            <div><span id="radio-channel">0.0</span> Mhz [Radio]</div>
            <div><span id="voice-mode">NORMAL</span> [Range]</div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GCR Radial Menu</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main id="app" class="app" aria-hidden="true">
        <section id="radial" class="radial" aria-label="Radial menu">
            <div id="connectorLayer" class="connector-layer"></div>
            <div id="items" class="items"></div>

            <button id="center" class="center" type="button" aria-label="Back or close">
                <span class="center-kicker">GCR</span>
                <strong id="centerTitle" class="center-title">RADIAL</strong>
                <span id="centerHint" class="center-hint">MENU</span>
            </button>
        </section>

        <div class="help">
            <span>ESC close</span>
            <i></i>
            <span>BACKSPACE back</span>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
